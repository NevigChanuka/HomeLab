name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned validation tools
        run: |
          python -m pip install yamllint==1.35.1
          npm install --prefix "$RUNNER_TEMP/markdownlint" markdownlint-cli2@0.18.1
          echo "$RUNNER_TEMP/markdownlint/node_modules/.bin" >> "$GITHUB_PATH"
          bash scripts/install-ci-tools.sh
      - name: Validate repository
        run: bash scripts/validate.sh
      - name: Scan Git history for secrets
        run: gitleaks git --redact
